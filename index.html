<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hub Pessoal</title><link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-status-bar-style" content="black"><style>
:root{--bg:#0B0F14;--bg2:#111820;--card:#151D26;--bd:#24303D;--tx:#F1F5F9;--t2:#94A3B8;--ac:#3B82F6;--ac2:#60A5FA;--ok:#22C55E;--wa:#F59E0B;--er:#EF4444}

#tt{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ok);color:#06210f;font-weight:700;padding:12px 20px;border-radius:12px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.45);display:none;text-align:center;max-width:92vw}#tt.on{display:block;animation:f .25s}

</style></head><body><nav id=nv></nav><main id=mn></main><div id=md></div><div id=tt></div><div id=fo><div id=ft>00:00:00</div><div id=fl></div><div id=fc><button id=fp onclick="A.t1()">⏸ Pausar</button><button onclick="A.t2(1)">⏹ Finalizar</button><button onclick="fx()">✕ Sair da tela cheia</button></div></div><script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},TD=()=>D(),add=(d,n)=>{d=new Date(d);d.setDate(d.getDate()+n);return d};
let S;try{S=JSON.parse(localStorage.getItem('hub'))}catch(e){}
const DEF=()=>({name:'',theme:'dark',rest:90,cats:['Estudos','Pessoal','Saúde'],tasks:[],events:[],subjects:[],sessions:[],qs:[],plans:[],workouts:[],habits:[],projects:[],notes:[],timer:{acc:0,start:null,sel:''},active:null});S=Object.assign(DEF(),S||{});
const sv=()=>{SY.chk();try{localStorage.setItem('hub',JSON.stringify(S))}catch(e){}},RD=()=>{sv();render()};
const sum=(a,k)=>a.reduce((x,y)=>x+(y[k]||0),0),fd=s=>Math.floor(s/3600)+'h '+String(Math.floor(s%3600/60)).padStart(2,'0')+'min',pc=(a,n)=>n?(a/n*100).toFixed(1).replace('.',',').replace(',0','')+'%':'—',mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const PG=[['home','🏠','Início'],['est','📚','Estudos'],['gym','🏋️','Academia'],['tar','✅','Tarefas'],['age','📅','Agenda'],['hab','🎯','Hábitos'],['pro','🚀','Projetos'],['not','📝','Notas'],['sta','📊','Estatísticas'],['cfg','⚙️','Configurações']];
let page='home',tf='hoje',ag={v:'month',d:new Date()},nc='Todas',nq='',gx='';
function fm(t,f,cb,del){const m=$('#md');m.innerHTML=`<form class=box><h3>${t}</h3>${f.map(x=>`<label>${x.l}${x.t=='textarea'?`<textarea name=${x.k} rows=5>${esc(x.v)}</textarea>`:x.t=='select'?`<select name=${x.k}>${x.o.map(o=>`<option value="${esc(o[0])}"${o[0]==x.v?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input name=${x.k} type=${x.t||'text'} value="${esc(x.v)}"${x.r?' required':''}${x.t=='number'?' step=any min=0':''}>`}</label>`).join('')}<div class=row><button class=b>Salvar</button>${del?'<button type=button class="b er" id=dl>Excluir</button>':''}${t=='Seu nome'?'':'<button type=button class="b g" id=cn>Cancelar</button>'}</div></form>`;m.className='on';const fr=m.firstChild,cl=()=>m.className='';fr.onsubmit=e=>{e.preventDefault();const o={};new FormData(fr).forEach((v,k)=>o[k]=v);cl();cb(o)};if($('#cn'))$('#cn').onclick=cl;if(del)$('#dl').onclick=()=>{cl();del()};const i=fr.querySelector('input,textarea');i&&i.focus()}
const opts=n=>[...(n?[['|','Sem matéria']]:[]),...S.subjects.flatMap(s=>[[s.id+'|',s.name],...s.topics.map(t=>[s.id+'|'+t.id,s.name+' — '+t.name])])],sn=k=>{const[a,b]=(k||'|').split('|'),s=S.subjects.find(x=>x.id==a);if(!s)return'Sem matéria';const t=s.topics.find(x=>x.id==b);return s.name+(t?' — '+t.name:'')};
function chart(v,l,line){if(!v.length)return'<p class=s>Sem dados ainda.</p>';const W=500,H=130,m=Math.max(...v,1),w=W/v.length;let o=`<svg viewBox="0 0 ${W} ${H+22}" style="width:100%">`;if(line){const p=v.map((y,i)=>`${i*w+w/2},${H-y/m*H+6}`).join(' ');o+=`<polyline points="${p}" fill=none stroke="var(--ac)" stroke-width=2.5 />`+v.map((y,i)=>`<circle cx=${i*w+w/2} cy=${H-y/m*H+6} r=3.5 fill="var(--ac2)"/><text x=${i*w+w/2} y=${H-y/m*H-2} fill="var(--t2)" font-size=11 text-anchor=middle>${y}</text>`).join('')}else o+=v.map((y,i)=>`<rect x=${i*w+w*.15} y=${H-y/m*H} width=${w*.7} height=${y/m*H} rx=3 fill="var(--ac)"/>`).join('');return o+l.map((t,i)=>`<text x=${i*w+w/2} y=${H+16} fill="var(--t2)" font-size=11 text-anchor=middle>${t}</text>`).join('')+'</svg>'}
const PR={alta:'var(--er)',media:'var(--wa)',baixa:'var(--ok)'};
const tk=x=>`<div class=r><input type=checkbox ${x.done?'checked':''} onchange="A.td('${x.id}')"><span class=dot style="background:${PR[x.pr]}"></span><div class=f><div class="${x.done?'dn':''}">${esc(x.t)}</div><div class=s>${[x.date&&x.date.split('-').reverse().slice(0,2).join('/'),x.time,x.cat].filter(Boolean).join(' · ')}</div></div><button class="b g sm" onclick="A.te('${x.id}')">✎</button></div>`;
const evr=x=>`<div class=r><b style="width:92px">${x.s}${x.e?'–'+x.e:''}</b><div class=f>${esc(x.t)}</div><button class="b g sm" onclick="A.ee('${x.id}')">✎</button></div>`;
const todayTasks=()=>S.tasks.filter(x=>x.date===TD()||(!x.date&&!x.done));
const P={
home(){const t=TD(),h=new Date().getHours(),ts=todayTasks(),dn=ts.filter(x=>x.done).length,ss=S.sessions.filter(x=>x.date===t),q=S.qs.filter(x=>x.date===t),qn=sum(q,'n'),qa=sum(q,'a'),ev=S.events.filter(x=>x.date===t).sort((a,b)=>a.s>b.s?1:-1),pl=S.plans.length?S.plans[S.workouts.length%S.plans.length]:null,p=ts.length?Math.round(dn/ts.length*100):0;
return`<h1>${h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}${S.name?', '+esc(S.name):''}.</h1><div class=s id=clk></div>
<div class=g2><div class=c><h2>Progresso do dia</h2><div class=big>${p}%</div><div class=bar><i style="width:${p}%"></i></div><p class=s style="margin-top:6px">${dn} de ${ts.length} tarefas</p></div>
<div class=c><h2>📚 Estudos hoje</h2><div class=row style="gap:22px"><div><b>${fd(sum(ss,'sec'))}</b><div class=s>estudadas</div></div><div><b>${qn}</b><div class=s>questões</div></div><div><b>${qa}</b><div class=s>acertos</div></div><div><b>${pc(qa,qn)}</b><div class=s>aproveitamento</div></div></div><button class=b style="margin-top:12px" onclick="go('est')">Continuar estudando</button></div>
<div class=c><h2>✅ Tarefas de hoje <button class="b sm" onclick="A.tn()" style="float:right">+</button></h2>${ts.map(tk).join('')||'<p class=s>Nenhuma tarefa para hoje.</p>'}</div>
<div class=c><h2>📅 Agenda de hoje <button class="b sm" onclick="A.en('${t}')" style="float:right">+</button></h2>${ev.map(evr).join('')||'<p class=s>Nenhum compromisso hoje.</p>'}</div>
<div class=c><h2>🏋️ Treino</h2>${S.active?`<p>Treino em andamento: <b>${esc(S.active.name)}</b></p><button class=b onclick="go('gym')">Continuar</button>`:pl?`<p><b>${esc(pl.name)}</b></p><button class=b style="margin-top:8px" onclick="A.ws('${pl.id}')">Começar treino</button>`:'<p class=s>Crie uma ficha na Academia.</p><button class="b g" style="margin-top:8px" onclick="go(\'gym\')">Ir para Academia</button>'}</div></div>`},
est(){const T=S.timer,ss=S.sessions.slice(-6).reverse(),qs=S.qs.slice(-6).reverse();
return`<h1>Estudos</h1><div class=g2><div class=c><h2>Sessão de estudo</h2><div class=big id=tm>00:00:00</div><label style="margin-top:8px">Matéria / assunto<select onchange="S.timer.sel=this.value;sv()">${opts(1).map(o=>`<option value="${esc(o[0])}"${o[0]==T.sel?' selected':''}>${esc(o[1])}</option>`).join('')}</select></label><div class=row><button class=b onclick="A.t1()">${T.start?'⏸ Pausar':'▶ Iniciar'}</button><button class="b g" onclick="A.t2()">⏹ Finalizar</button><button class="b g" onclick="fs()">⛶ Tela cheia</button></div></div>
<div class=c><h2>Questões <button class="b sm" style="float:right" onclick="A.qn()">+ Registrar</button></h2>${qs.map(x=>`<div class=r><div class=f>${esc(sn(x.sid+'|'+x.tid))}<div class=s>${x.date.split('-').reverse().join('/')} · ${x.n} questões, ${x.a} acertos, ${x.n-x.a} erros</div></div><b>${pc(x.a,x.n)}</b><button class="b g sm" onclick="A.qd('${x.id}')">✕</button></div>`).join('')||'<p class=s>Nada registrado.</p>'}</div>
<div class=c style="grid-column:1/-1"><h2>Matérias e assuntos <button class="b sm" style="float:right" onclick="A.sn()">+ Matéria</button></h2>${S.subjects.map(s=>`<div style="margin-bottom:16px"><div class=row><b class=f>${esc(s.name)}</b><button class="b g sm" onclick="A.tn2('${s.id}')">+ Assunto</button><button class="b g sm" onclick="A.se('${s.id}')">✎</button></div>${s.topics.map(t=>`<div class=r><span class=f>${esc(t.name)}</span><input type=range min=0 max=100 step=5 value=${t.p} style="width:120px" onchange="A.tp('${s.id}','${t.id}',this.value)"><b style="width:44px;text-align:right">${t.p}%</b><button class="b g sm" onclick="A.td2('${s.id}','${t.id}')">✕</button></div>`).join('')}</div>`).join('')||'<p class=s>Cadastre sua primeira matéria.</p>'}</div>
<div class=c style="grid-column:1/-1"><h2>Sessões recentes</h2>${ss.map(x=>`<div class=r><div class=f>${esc(sn(x.sid+'|'+x.tid))}<div class=s>${x.date.split('-').reverse().join('/')}${x.obs?' · '+esc(x.obs):''}</div></div><b>${fd(x.sec)}</b><button class="b g sm" onclick="A.sd('${x.id}')">✕</button></div>`).join('')||'<p class=s>Nenhuma sessão.</p>'}</div></div>`},
gym(){const a=S.active;if(a)return`<h1>${esc(a.name)}</h1><div class=row style="margin:4px 0"><p class=s id=rs>Descanso: pronto</p><button class="b g sm" onclick="A.nt()">🔔 Avisos</button></div><div class=g2>${a.ex.map((e,i)=>`<div class=c><h2>${esc(e.n)} <span class=s>${e.s}×${e.r}</span></h2>${e.sets.map((x,j)=>`<div class=r>Série ${j+1} — ${x.l}kg — ${x.r} reps</div>`).join('')}<div class=row style="margin-top:8px"><input id=l${i} type=number placeholder="kg" style="width:80px"><input id=r${i} type=number placeholder="reps" value=${e.r} style="width:80px"><button class="b sm" onclick="A.gs(${i})">Concluir série</button></div></div>`).join('')}</div><div class=row style="margin-top:18px"><button class=b onclick="A.wf()">Finalizar treino</button><button class="b g" onclick="A.wc()">Cancelar</button></div>`;
const ns=[...new Set(S.workouts.flatMap(w=>w.ex.map(e=>e.n)))],sel=gx||ns[0],ev=S.workouts.map(w=>{const e=w.ex.find(x=>x.n==sel);return e&&e.sets.length?[w.date,Math.max(...e.sets.map(x=>+x.l))]:0}).filter(Boolean);
return`<h1>Academia</h1><div class=g2><div class=c><h2>Fichas <button class="b sm" style="float:right" onclick="A.pn()">+ Ficha</button></h2>${S.plans.map(p=>`<div class=r><div class=f><b>${esc(p.name)}</b><div class=s>${p.ex.map(e=>esc(e.n)+' '+e.s+'×'+e.r).join(' · ')}</div></div><button class=b onclick="A.ws('${p.id}')">Começar</button><button class="b g sm" onclick="A.pe('${p.id}')">✎</button></div>`).join('')||'<p class=s>Crie sua primeira ficha.</p>'}</div>
<div class=c><h2>Evolução de carga</h2>${ns.length?`<select onchange="gx=this.value;render()">${ns.map(n=>`<option${n==sel?' selected':''}>${esc(n)}</option>`).join('')}</select>${chart(ev.map(x=>x[1]),ev.map(x=>x[0].slice(8)+'/'+x[0].slice(5,7)),1)}`:'<p class=s>Aparece após o primeiro treino.</p>'}</div>
<div class=c style="grid-column:1/-1"><h2>Histórico</h2>${S.workouts.slice().reverse().map(w=>`<div class=r style="align-items:flex-start"><div class=f><b>${esc(w.name)}</b> <span class=s>${w.date.split('-').reverse().join('/')} · ${fd(w.sec)}</span>${w.ex.map(e=>`<div class=s>${esc(e.n)}: ${e.sets.map(x=>x.l+'kg×'+x.r).join(', ')||'—'}</div>`).join('')}</div><button class="b g sm" onclick="A.wd('${w.id}')">✕</button></div>`).join('')||'<p class=s>Nenhum treino registrado.</p>'}</div></div>`},
tar(){const t=TD(),F={hoje:x=>x.date==t,amanha:x=>x.date==D(add(new Date(),1)),semana:x=>x.date>=t&&x.date<=D(add(new Date(),7)),pend:x=>!x.done,conc:x=>x.done,todas:()=>1},L=S.tasks.filter(F[tf]).sort((a,b)=>(a.done-b.done)||((a.date||'9')+(a.time||'')>(b.date||'9')+(b.time||'')?1:-1));
return`<h1>Tarefas <button class="b sm" onclick="A.tn()">+</button></h1><div class=row style="margin:14px 0">${[['hoje','Hoje'],['amanha','Amanhã'],['semana','Semana'],['pend','Pendentes'],['conc','Concluídas'],['todas','Todas']].map(f=>`<span class="ch ${tf==f[0]?'on':''}" onclick="tf='${f[0]}';render()">${f[1]}</span>`).join('')}</div><div class=c>${L.map(tk).join('')||'<p class=s>Nada aqui.</p>'}</div>`},
age(){const d=ag.d,t=TD(),nv=`<div class=row style="margin:14px 0"><button class="b g sm" onclick="A.an(-1)">‹</button><button class="b g sm" onclick="A.an(1)">›</button><button class="b g sm" onclick="ag.d=new Date();render()">Hoje</button>${['month','week','day'].map(v=>`<span class="ch ${ag.v==v?'on':''}" onclick="ag.v='${v}';render()">${{month:'Mês',week:'Semana',day:'Dia'}[v]}</span>`).join('')}<button class="b sm" onclick="A.en('${D(d)}')">+ Evento</button></div>`;
